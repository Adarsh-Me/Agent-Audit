# Model pins — single source of truth (TECHSPEC §2/§3.2).
# SINGLE-MODEL MODE 2026-08-26 (owner call): audit runs call ONLY ONE provider/
# model. Current pin: OpenCode Zen's x-preview-f-free via OpenAI-style
# https://opencode.ai/zen/v1/chat/completions (key: OPENCODE_ZEN_API_KEY).
# History (all 2026-08-26): OpenRouter pins (stealth/ox-alpha, nemotron)
# removed → OpenCode mimo-v2.5-free (free pool 429-throttled all morning) →
# tokenbom deepseek-v4-flash (worked, owner swapped away same evening) → back
# to OpenCode Zen x-preview-f-free. Restore points in git history.
# NOTE: OpenCode free pool was returning upstream-unavailable errors at pin
# time (~15:40 IST); runs count honest provider failures until it heals.
# Matrix: 1 bulk × 200 + 1 flagship × 20 = 220 trials; constants.py mirrors this.
bulk:
  - id: xpreview
    openrouter_id: x-preview-f-free
    version: "x-preview-f-free@2026-08-26"
    json_mode: true          # unverified live (pool down at swap time); flip false if parse failures appear
    seed_supported: false
    base_url: https://opencode.ai/zen/v1
    endpoint: openai
    api_key_env: opencode_zen_api_key
flagship:
  # version carries a -flagship suffix ON PURPOSE: flagship trials reuse (P07,
  # condition) slots already run by bulk, and the response cache keys on
  # (prompt_hash, model_version) — identical labels would let flagship rows
  # silently ride bulk cache entries.
  - id: xpreview-flagship
    openrouter_id: x-preview-f-free
    version: "x-preview-f-free@2026-08-26-flagship"
    json_mode: true
    seed_supported: false
