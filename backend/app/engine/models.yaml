# Model pins — single source of truth (TECHSPEC §2/§3.2).
# SINGLE-MODEL MODE 2026-08-27: owner swap to Sarvam 105b (sarvam-105b-conversations)
# via api.sarvam.ai. Wire format is OpenAI-style (sarvamai SDK exposes
# client.chat.completions), routed through the existing base_url/api_key_env
# machinery — the engine never imports the SDK directly. Key in backend/.env
# (gitignored); the in-tree field is sarvam_api_key. Pricing in
# backend/app/engine/client.py PRICING_USD_PER_MTOK must mirror these ids.
# Restore points in git history (OpenCode Zen x-preview-f-free, etc.).
# Matrix: 1 bulk × 200 + 1 flagship × 20 = 220 trials; constants.py mirrors this.
bulk:
  - id: sarvam-105b
    openrouter_id: sarvam-105b-conversations
    version: "sarvam-105b-conversations@2026-08-27"
    json_mode: false  # 2026-08-27: Sarvam didn't honor response_format on real 100-SKU
                      # prompts — every trial hit parse-fail → 3-attempt retry loop
                      # which turned a 5-min audit into 28 min. Prompt-only JSON
                      # enforcement + the existing extractor handles prose wrapping.
    seed_supported: false
    base_url: https://api.sarvam.ai
    endpoint: openai
    api_key_env: sarvam_api_key
flagship:
  # version carries a -flagship suffix ON PURPOSE: flagship trials reuse (P07,
  # condition) slots already run by bulk, and the response cache keys on
  # (prompt_hash, model_version) — identical labels would let flagship rows
  # silently ride bulk cache entries.
  - id: sarvam-105b-flagship
    openrouter_id: sarvam-105b-conversations
    version: "sarvam-105b-conversations@2026-08-27-flagship"
    json_mode: false
    seed_supported: false
    base_url: https://api.sarvam.ai
    endpoint: openai
    api_key_env: sarvam_api_key
